name: Test and publish configurations
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: discover group ID or publish tested configs
        type: choice
        options: [discover, publish]
        default: discover

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover test group
        if: inputs.mode == 'discover'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bot.mjs --discover
      - uses: actions/setup-go@v5
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        with:
          go-version: '1.26'
      - name: Build proxy tester
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          git clone https://github.com/soroushyasini/proxysmith.git "$RUNNER_TEMP/proxysmith"
          git -C "$RUNNER_TEMP/proxysmith" checkout 31c13f857bbc67e794f795c2d6a42b91f679651b
          cd "$RUNNER_TEMP/proxysmith/go"
          go build -o "$RUNNER_TEMP/proxysmith-bin" .
      - name: Download and test subscription
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          "$RUNNER_TEMP/proxysmith-bin" --sub-url 'https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub3.txt' --test-count 500 --sample-n 3 --max-ping-ms 5000 --test-url 'https://cp.cloudflare.com/generate_204' --concurrency 20 --output-format jsonl > results.jsonl
      - name: Publish to test group
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot.mjs
